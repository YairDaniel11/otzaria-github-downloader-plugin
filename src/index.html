<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הורדת מאגר ספרים</title>
<style>
:root {
    --primary: #1976d2;
    --on-primary: #ffffff;
    --surface: #ffffff;
    --on-surface: #1a1a1a;
    --surface-container: #f3f4f6;
    --topbar: #ECE6F0;
    --on-surface-variant: #49454F;
    --outline: #d1d5db;
    --font-family: system-ui, sans-serif;
    --font-size: 15px;
    --line-height: 1.5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
    background: var(--surface);
    color: var(--on-surface);
    font-family: var(--font-family);
    font-size: var(--font-size);
    line-height: var(--line-height);
    overflow: hidden;   /* הגלילה קורית בתוכן, לא בעמוד */
}

.app-shell { display: flex; flex-direction: column; height: 100%; }
.app-content { flex: 1; overflow-y: auto; padding: 20px 20px 60px; }

/* פס כותרת קבוע — גדלים ב-px קשיחים בכוונה; ראה DESIGN_GUIDE § סרגל כותרת התוסף */
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    height: 56px;
    padding: 0 16px;
    flex-shrink: 0;
    background: var(--topbar);
}
.topbar h2 {
    color: var(--on-surface);
    font-size: 16px;
    font-weight: 600;
    margin: 0;
}
@media (max-width: 600px) { .topbar { height: 44px; } }

#release-name {
    font-size: 0.8rem;
    color: var(--on-surface-variant);
    margin-bottom: 16px;
}

/* שגיאה */
#error-msg {
    display: none;
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fca5a5;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 0.9rem;
}

/* פס המאגר המלא */
.full-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface-container);
    border: 1px solid var(--outline);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
}
.full-bar span { flex: 1; font-weight: 600; font-size: 0.95rem; }
#full-library-btn {
    display: none;
    align-items: center;
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    border-radius: 20px;
    padding: 7px 18px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
}
#full-library-btn:hover { opacity: 0.88; }

/* עץ */
#tree {
    border: 1px solid var(--outline);
    border-radius: 12px;
    overflow: hidden;
}
.tree-node + .tree-node { border-top: 1px solid var(--outline); }
.tree-children .tree-node { border-top: 1px solid var(--outline); }

.tree-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    transition: background 0.12s;
}
.tree-row:hover { background: var(--surface-container); }

.toggle {
    width: 16px;
    flex-shrink: 0;
    text-align: center;
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--primary);
    user-select: none;
}

.node-name {
    flex: 1;
    font-size: 0.95rem;
}
.node-name.folder {
    font-weight: 600;
    cursor: pointer;
}
.node-name.folder:hover { color: var(--primary); }

.node-size {
    font-size: 0.75rem;
    opacity: 0.45;
    flex-shrink: 0;
    white-space: nowrap;
}

.dl-btn {
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    border-radius: 14px;
    padding: 4px 14px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    font-family: inherit;
    white-space: nowrap;
}
.dl-btn:hover { opacity: 0.88; }
.dl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* אייקון סטטוס */
svg.status-icon { flex-shrink: 0; display: block; }

/* חיפוש */
#search-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-container);
    border: 1px solid var(--outline);
    border-radius: 12px;
    padding: 8px 14px;
    margin-bottom: 16px;
}
#search-icon {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    opacity: 0.45;
    fill: var(--on-surface);
}
#search-input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--on-surface);
    outline: none;
    direction: rtl;
}
#search-input::placeholder { opacity: 0.4; }
#search-clear {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    opacity: 0.4;
    padding: 0;
    line-height: 1;
    flex-shrink: 0;
}
#search-clear:hover { opacity: 0.8; }

.search-path {
    font-size: 0.72rem;
    opacity: 0.4;
    direction: ltr;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
}

.loading, .empty {
    text-align: center;
    padding: 36px;
    opacity: 0.45;
}

/* מד התקדמות — כפתור עצירה + אנימציית "עדיין עובד" */
.progress-stop-btn {
    display: none;
    align-items: center;
    background: none;
    border: 1px solid #dc2626;
    color: #dc2626;
    border-radius: 14px;
    padding: 2px 12px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    flex-shrink: 0;
    margin-right: 8px;
}
.progress-stop-btn:hover { background: #dc2626; color: #fff; }
.progress-stop-btn:disabled { opacity: 0.4; cursor: not-allowed; background: none; color: #dc2626; }

.progress-fill.active {
    background-image: linear-gradient(90deg,
        transparent, rgba(255,255,255,0.55) 50%, transparent);
    background-size: 50px 100%;
    animation: progress-shimmer 1s linear infinite;
}
@keyframes progress-shimmer {
    from { background-position: 150px 0; }
    to   { background-position: -150px 0; }
}

/* קובייה נפרדת: קבצי קישורים וסדר הדורות */
#links-card {
    display: none;
    margin-top: 24px;
    border: 2px solid var(--primary);
    border-radius: 12px;
    overflow: hidden;
}
.links-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--surface-container);
}
.links-title { flex: 1; font-weight: 700; font-size: 0.95rem; }
.info-btn {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1.5px solid var(--primary);
    background: transparent;
    color: var(--primary);
    font: italic 700 14px/1 Georgia, serif;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.info-btn:hover, .info-btn[aria-expanded="true"] {
    background: var(--primary);
    color: var(--on-primary);
}
.links-info {
    padding: 12px 16px;
    font-size: 0.86rem;
    line-height: 1.7;
    border-top: 1px solid var(--outline);
    background: var(--surface);
}
.links-info p { margin-bottom: 6px; }
.links-info ol { margin: 0 20px 6px 0; padding: 0; }
.links-note { opacity: 0.65; font-size: 0.8rem; }
.links-rows .tree-row { border-top: 1px solid var(--outline); }
</style>
</head>
<body>
<div class="app-shell">

<div class="topbar">
    <h2>הורדת מאגר ספרים</h2>
    <div id="filter-bar" style="display:none;">
        <button id="filter-btn" onclick="toggleNewFilter()" style="
            background:var(--surface-container);color:var(--on-surface);
            border:1px solid var(--outline);border-radius:20px;
            padding:5px 14px;font-family:inherit;font-size:0.82rem;
            font-weight:600;cursor:pointer;white-space:nowrap;
            transition:background 0.15s,color 0.15s,border-color 0.15s;">
            <span id="filter-label">הצג חדשים ועדכונים</span>
        </button>
    </div>
</div>

<div class="app-content">
<div id="release-name"></div>
<div id="summary" style="display:none;font-size:0.82rem;opacity:0.55;margin-bottom:12px;">
    <span id="summary-text"></span>
</div>

<div id="folder-bar" style="display:none;align-items:center;gap:8px;font-size:0.82rem;margin-bottom:12px;padding:8px 12px;background:var(--surface-container);border-radius:10px;"></div>

<label id="ignore-shas-wrap" style="display:flex;align-items:center;gap:8px;font-size:0.82rem;margin-bottom:12px;cursor:pointer;">
    <input type="checkbox" id="ignore-shas" onchange="setIgnoreShas(this.checked)">
    <span>התעלם מ"שס וגשל" (בתוך תלמוד בבלי) — הצג חדשים ועדכונים ב"תלמוד בבלי" בלעדיו, ואל תוריד אותו</span>
</label>

<div id="error-msg"></div>

<div id="search-wrap">
    <svg id="search-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16.1017 17.1624C14.717 18.3101 12.9391 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11C19 12.9391 18.3101 14.717 17.1624 16.1018L21.7803 20.7197C22.0732 21.0126 22.0732 21.4874 21.7803 21.7803C21.4874 22.0732 21.0125 22.0732 20.7196 21.7803L16.1017 17.1624ZM17.5 11C17.5 7.41015 14.5899 4.5 11 4.5C7.41015 4.5 4.5 7.41015 4.5 11C4.5 14.5899 7.41015 17.5 11 17.5C14.5899 17.5 17.5 14.5899 17.5 11Z"/></svg>
    <input id="search-input" type="text" placeholder="חפש ספר או תיקייה...">
    <button id="search-clear" title="נקה חיפוש">✕</button>
</div>

<div class="full-bar">
    <span>המאגר המלא — כל הספרים</span>
    <button id="reset-status-btn" onclick="resetHashes()" style="
        display:none;align-items:center;gap:4px;
        background:var(--surface-container);color:var(--on-surface);
        border:1px solid var(--outline);border-radius:20px;
        padding:7px 14px;font-size:0.85rem;font-weight:700;
        cursor:pointer;font-family:inherit;white-space:nowrap;">
        <svg viewBox="0 0 24 24" width="15" height="15" style="fill:currentColor;flex-shrink:0;vertical-align:middle;"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8c-.45-.83-.7-1.79-.7-2.8 0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></svg>
        איפוס סטטוס
    </button>
    <button id="update-changes-btn" onclick="startDownloadUpdates(this)" style="
        display:none;align-items:center;gap:4px;
        background:#f59e0b;color:#fff;border:none;border-radius:20px;
        padding:7px 14px;font-size:0.85rem;font-weight:700;
        cursor:pointer;font-family:inherit;white-space:nowrap;">
        <svg viewBox="0 0 24 24" width="15" height="15" style="fill:#fff;flex-shrink:0;vertical-align:middle;"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        עדכן שינויים
    </button>
    <button id="full-library-btn">הורד הכל</button>
</div>

<!-- הודעת הצלחה -->
<div id="success-msg" style="display:none;background:#f0fdf4;color:#15803d;border:1px solid #86efac;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:0.9rem;font-weight:600;"></div>

<!-- מד התקדמות -->
<div id="progress-bar" style="display:none;background:var(--surface-container);border:1px solid var(--outline);border-radius:12px;padding:14px 16px;margin-bottom:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:0.85rem;">
        <span class="progress-name" style="font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
        <button class="progress-stop-btn" onclick="requestCancel()">עצור</button>
        <span class="progress-label" style="opacity:0.55;flex-shrink:0;">0%</span>
    </div>
    <div style="background:var(--outline);border-radius:99px;height:6px;overflow:hidden;">
        <div class="progress-fill" style="background:var(--primary);height:100%;width:0%;transition:width 0.2s;border-radius:99px;"></div>
    </div>
</div>

<!-- פריטים שנכשלו -->
<div id="failed-panel-wrap" style="display:none;background:#fff8e1;border:1px solid #ffe082;border-radius:10px;padding:14px 16px;margin-bottom:16px;">
    <div style="font-weight:700;font-size:0.88rem;margin-bottom:8px;color:#b45309;">פריטים שנכשלו — לחץ "הורד ידנית" להורדה דרך הדפדפן:</div>
    <div id="failed-panel"></div>
</div>

<!-- fallback: העתקת קישור -->
<div id="copy-toast" style="display:none;position:fixed;bottom:20px;right:20px;left:20px;background:#1a1a1a;color:#fff;border-radius:12px;padding:14px 16px;z-index:999;font-size:0.88rem;box-shadow:0 4px 20px rgba(0,0,0,0.35);">
    <div style="font-weight:700;margin-bottom:4px;">הורדה ישירה לא נתמכת — הועתק ללוח</div>
    <div style="opacity:0.7;margin-bottom:6px;font-size:0.82rem;">הדבק בדפדפן כדי להוריד את "<span class="copy-name"></span>"</div>
    <div class="copy-url" style="opacity:0.45;font-size:0.75rem;word-break:break-all;direction:ltr;text-align:left;"></div>
</div>

<div id="tree">
    <div class="loading" id="loading">טוען רשימה...</div>
</div>

<!-- קובייה נפרדת: קבצי קישורים וסדר הדורות (מצוירת ב-renderLinksCard) -->
<div id="links-card"></div>

</div><!-- /.app-content -->
</div><!-- /.app-shell -->

<script src="books_data.js"></script>
<script src="app.js"></script>
</body>
</html>
